<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>Anliego wird aktualisiert</title>
<link rel="icon" href="/images/anliego-icon.svg">
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#818cf8; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { background:var(--card); border-radius:16px; padding:2rem 1.75rem; max-width:26rem; text-align:center;
         box-shadow:0 1px 3px rgb(0 0 0 / .08), 0 8px 24px rgb(0 0 0 / .06); }
  img { width:56px; height:56px; }
  h1 { font-size:1.25rem; margin:1rem 0 .5rem; }
  p { color:var(--muted); line-height:1.5; margin:.5rem 0; }
  .spinner { width:22px; height:22px; margin:1.25rem auto 0; border-radius:50%; border:3px solid color-mix(in srgb, var(--accent) 25%, transparent);
             border-top-color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <img src="/images/anliego-icon.svg" alt="">
  <h1>Anliego wird gerade aktualisiert</h1>
  <p>Das dauert meist nur wenige Minuten. Die Seite lädt sich von selbst neu, sobald es weitergeht.</p>
  <p>Nichts geht verloren: E-Mails werden danach wie gewohnt abgeholt.</p>
  <div class="spinner" aria-hidden="true"></div>
</main>
</body>
</html>
